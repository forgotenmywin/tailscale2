name: RDP Tunnel via Serveo

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo apt-get update
          sudo apt-get install -y tailscale

      - name: Connect Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=serveo-tunnel
          echo "✅ Tailscale connected"

      - name: Create Serveo Tunnel
        run: |
          WIN_IP="${{ secrets.WINDOWS_IP }}"
          echo "============================================"
          echo "🚀 Connecting to Windows RDP at $WIN_IP"
          echo "============================================"
          ssh -o StrictHostKeyChecking=no -R 0:$WIN_IP:3389 serveo.net

      - name: Keep Alive
        run: |
          echo "⏳ Tunnel is active... Check logs for port"
          while true; do sleep 300; done
