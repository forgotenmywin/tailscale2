name: RDP Tunnel via Bore (Ubuntu)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo apt-get update
          sudo apt-get install -y tailscale tailscale-archive-keyring

      - name: Connect to Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=bore-tunnel
          TS_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "✅ Tailscale connected! IP: $TS_IP"

      - name: Install Bore
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -L https://github.com/ekzhang/bore/releases/latest/download/bore-linux-x86_64.zip -o bore.zip
          unzip bore.zip
          sudo mv bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore
          echo "✅ Bore installed successfully!"

      - name: Create Bore Tunnel to Windows RDP
        run: |
          WIN_IP="${{ secrets.WINDOWS_IP }}"
          echo "============================================"
          echo "🚀 Connecting to Windows RDP at $WIN_IP via Bore"
          echo "============================================"
          echo ""
          echo "⏳ Creating tunnel... This may take a few seconds."
          echo ""
          bore local $WIN_IP:3389 --to bore.pub

      - name: Display Connection Details
        run: |
          echo "============================================"
          echo "🚀 RDP TUNNEL VIA BORE IS READY"
          echo "============================================"
          echo ""
          echo "📋 CONNECTION DETAILS:"
          echo "   Look at the logs of 'Create Bore Tunnel' step"
          echo "   Find: 'Listening at bore.pub:PORT'"
          echo ""
          echo "   Username: runneradmin"
          echo "   Password: WindowsRDP#2025"
          echo ""
          echo "🔗 Connect with any RDP client:"
          echo "   Address: bore.pub:PORT"
          echo "   Username: runneradmin"
          echo "   Password: WindowsRDP#2025"
          echo ""
          echo "============================================"
          echo "⏳ Session will stay alive for 6 hours..."

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
            echo "✓ Session active - $(date '+%H:%M:%S')"
          done
