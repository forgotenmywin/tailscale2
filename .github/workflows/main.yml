name: RDP Tunnel via Bore (Ubuntu)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 5
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=bore-tunnel

          echo "Connected to Tailscale"
          sudo tailscale status

      - name: Install Bore + Socat
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo socat

          cargo install bore-cli

          sudo cp ~/.cargo/bin/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore

      - name: Forward Windows RDP
        run: |
          WIN_IP="${{ secrets.WINDOWS_IP }}"

          echo "Forwarding $WIN_IP:3389 -> localhost:3389"

          nohup socat TCP-LISTEN:3389,fork,reuseaddr TCP:$WIN_IP:3389 >/tmp/socat.log 2>&1 &

          sleep 3

          netstat -tln || ss -tln

      - name: Create Bore Tunnel
        run: |
          echo "Starting Bore..."
          bore local --to bore.pub 3389

      - name: Keep Alive
        if: always()
        run: |
          while true; do
            echo "Alive $(date)"
            sleep 300
          done
