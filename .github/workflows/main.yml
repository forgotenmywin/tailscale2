name: RDP + WinRM Tunnel via Bore (Ubuntu)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      WINDOWS_IP: ${{ secrets.WINDOWS_IP }}
      WINDOWS_USER: ${{ secrets.WINDOWS_USER }}
      WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

    steps:
      - name: Install Tailscale
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start and connect Tailscale
        run: |
          set -euo pipefail
          sudo tailscaled &
          sleep 8

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="bore-tunnel"

          echo "===== Tailscale Status ====="
          sudo tailscale status || true
          echo "===== Tailscale IP ====="
          sudo tailscale ip -4 || true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cargo socat iputils-ping netcat-openbsd python3 python3-pip

          cargo install bore-cli
          sudo cp ~/.cargo/bin/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore

          python3 -m pip install --upgrade pip
          python3 -m pip install pywinrm

      - name: Verify Windows reachability
        run: |
          set -euo pipefail
          WIN_IP="${WINDOWS_IP}"

          echo "======================================"
          echo "Windows IP: $WIN_IP"
          echo "======================================"

          if [ -z "$WIN_IP" ]; then
            echo "❌ WINDOWS_IP secret is empty"
            exit 1
          fi

          echo "===== Ping Test ====="
          ping -c 4 "$WIN_IP" || true

          echo "===== RDP Port Test ====="
          nc -zvw5 "$WIN_IP" 3389

          echo "===== WinRM Port Test ====="
          nc -zvw5 "$WIN_IP" 5985

          echo "✅ Windows is reachable, ports 3389 (RDP) and 5985 (WinRM) are open"

      - name: Start local forwards with socat
        run: |
          set -euo pipefail
          WIN_IP="${WINDOWS_IP}"

          echo "Starting socat forward: 127.0.0.1:3389 -> $WIN_IP:3389"
          nohup socat \
            TCP-LISTEN:3389,fork,reuseaddr \
            TCP:$WIN_IP:3389 \
            >/tmp/socat-rdp.log 2>&1 &

          echo "Starting socat forward: 127.0.0.1:5985 -> $WIN_IP:5985"
          nohup socat \
            TCP-LISTEN:5985,fork,reuseaddr \
            TCP:$WIN_IP:5985 \
            >/tmp/socat-winrm.log 2>&1 &

          sleep 3

          echo "===== Listening Ports ====="
          ss -tln || true

          echo "===== Socat Logs ====="
          echo "RDP log:"
          cat /tmp/socat-rdp.log || true
          echo "WinRM log:"
          cat /tmp/socat-winrm.log || true

      - name: Test local forwards
        run: |
          set -euo pipefail

          echo "===== Local RDP Forward Test ====="
          nc -zvw5 127.0.0.1 3389

          echo "===== Local WinRM Forward Test ====="
          nc -zvw5 127.0.0.1 5985

          echo "✅ Both local forwards are working"

      - name: Start Bore tunnels
        run: |
          set -euo pipefail

          echo "Starting Bore tunnel for RDP (3389)..."
          nohup bore local --to bore.pub 3389 >/tmp/bore-rdp.log 2>&1 &

          echo "Starting Bore tunnel for WinRM (5985)..."
          nohup bore local --to bore.pub 5985 >/tmp/bore-winrm.log 2>&1 &

          echo "Waiting for Bore to publish ports..."
          for i in $(seq 1 60); do
            if grep -q "listening at bore.pub:" /tmp/bore-rdp.log && grep -q "listening at bore.pub:" /tmp/bore-winrm.log; then
              break
            fi
            sleep 1
          done

          echo "===== Bore Logs ====="
          echo "RDP Bore log:"
          cat /tmp/bore-rdp.log || true
          echo "WinRM Bore log:"
          cat /tmp/bore-winrm.log || true

          BOR_RDP_PORT="$(grep -oE 'listening at bore\.pub:[0-9]+' /tmp/bore-rdp.log | tail -n1 | awk -F: '{print $2}')"
          BOR_WINRM_PORT="$(grep -oE 'listening at bore\.pub:[0-9]+' /tmp/bore-winrm.log | tail -n1 | awk -F: '{print $2}')"

          if [ -z "${BOR_RDP_PORT:-}" ]; then
            echo "❌ Bore did not publish a port for RDP"
            exit 1
          fi
          if [ -z "${BOR_WINRM_PORT:-}" ]; then
            echo "❌ Bore did not publish a port for WinRM"
            exit 1
          fi

          echo "Bore RDP port: $BOR_RDP_PORT"
          echo "Bore WinRM port: $BOR_WINRM_PORT"
          echo "BOR_RDP_PORT=$BOR_RDP_PORT" >> "$GITHUB_ENV"
          echo "BOR_WINRM_PORT=$BOR_WINRM_PORT" >> "$GITHUB_ENV"

      - name: Smoke test Bore endpoints
        run: |
          set -euo pipefail

          echo "===== Bore Smoke Test (RDP) ====="
          nc -zvw5 bore.pub "$BOR_RDP_PORT" || true

          echo "===== Bore Smoke Test (WinRM) ====="
          nc -zvw5 bore.pub "$BOR_WINRM_PORT" || true

          echo "✅ Both Bore tunnels are up"

      - name: Test WinRM from GitHub runner
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import winrm

          host = "http://127.0.0.1:5985/wsman"
          user = os.environ["WINDOWS_USER"]
          password = os.environ["WINDOWS_PASSWORD"]

          print("Connecting to WinRM...")
          s = winrm.Session(host, auth=(user, password), transport="ntlm")

          print("Running hostname...")
          r = s.run_cmd("hostname")

          print("STATUS:", r.status_code)
          print("STDOUT:")
          print(r.std_out.decode("utf-8", errors="replace"))
          print("STDERR:")
          print(r.std_err.decode("utf-8", errors="replace"))

          if r.status_code != 0:
              sys.exit(r.status_code)
          PY

      - name: Install RustDesk on Windows via WinRM
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import sys
          import textwrap
          import winrm

          host = "http://127.0.0.1:5985/wsman"
          user = os.environ["WINDOWS_USER"]
          password = os.environ["WINDOWS_PASSWORD"]
          rustdesk_password = os.environ["RUSTDESK_PASSWORD"]

          if not user:
              print("WINDOWS_USER is empty", file=sys.stderr)
              sys.exit(1)
          if not password:
              print("WINDOWS_PASSWORD is empty", file=sys.stderr)
              sys.exit(1)
          if not rustdesk_password or len(rustdesk_password) < 8:
              print("RUSTDESK_PASSWORD is empty or too short (min 8 chars)", file=sys.stderr)
              sys.exit(1)

          s = winrm.Session(host, auth=(user, password), transport="ntlm")
          pwd_b64 = base64.b64encode(rustdesk_password.encode("utf-8")).decode("ascii")

          ps_script = textwrap.dedent(f"""
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          function Write-Step($msg) {{
              Write-Host ""
              Write-Host "==== $msg ===="
          }}

          Write-Step "Fetching latest RustDesk release"
          $release = Invoke-RestMethod `
            -Headers @{{ "User-Agent" = "GitHubActions" }} `
            -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest"

          $asset = $release.assets | Where-Object {{
              $_.name -match '^rustdesk-.*-x86_64\\.(exe|msi)$'
          }} | Select-Object -First 1

          if (-not $asset) {{
              throw "Could not find a RustDesk x86_64 .exe or .msi asset in the latest release."
          }}

          $downloadUrl = $asset.browser_download_url
          $fileName = $asset.name
          $installer = Join-Path $env:TEMP $fileName

          Write-Host "Asset: $fileName"
          Write-Host "Downloading: $downloadUrl"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer

          if (-not (Test-Path $installer)) {{
              throw "Installer download failed: $installer"
          }}

          $isMsi = $fileName -like "*.msi"
          $installDir = Join-Path $env:ProgramFiles "RustDesk"
          $exe = Join-Path $installDir "rustdesk.exe"

          if ($isMsi) {{
              Write-Step "Silent MSI install"
              Start-Process msiexec.exe -ArgumentList @("/i", "`"$installer`"", "/qn", "/norestart") -Wait -NoNewWindow
          }} else {{
              Write-Step "Silent EXE install"
              Start-Process -FilePath $installer -ArgumentList "--silent-install" -Wait
          }}

          Start-Sleep -Seconds 15

          Write-Step "Ensuring RustDesk service exists"
          $svc = Get-Service -Name "Rustdesk" -ErrorAction SilentlyContinue
          if (-not $svc) {{
              if (-not (Test-Path $exe)) {{
                  throw "RustDesk executable not found at $exe"
              }}
              Set-Location $installDir
              Start-Process -FilePath $exe -ArgumentList "--install-service" -Wait
              Start-Sleep -Seconds 15
              $svc = Get-Service -Name "Rustdesk" -ErrorAction SilentlyContinue
          }}

          if (-not $svc) {{
              throw "RustDesk service was not created."
          }}

          if ($svc.Status -ne "Running") {{
              Start-Service -Name $svc.Name
              Start-Sleep -Seconds 5
              $svc.Refresh()
          }}

          if (-not (Test-Path $exe)) {{
              throw "RustDesk executable still not found at $exe"
          }}

          Write-Step "Reading RustDesk ID"
          Set-Location $installDir
          $rustdesk_id = (& $exe --get-id | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($rustdesk_id)) {{
              throw "RustDesk ID is empty."
          }}

          Write-Host "RustDesk ID: $rustdesk_id"

          Write-Step "Setting permanent password"
          $pwd = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("{pwd_b64}"))

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.Arguments = "--password $pwd"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true

          $p = [System.Diagnostics.Process]::Start($psi)
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          $p.WaitForExit()

          Write-Host "===== rustdesk --password stdout ====="
          Write-Host $stdout
          Write-Host "===== rustdesk --password stderr ====="
          Write-Host $stderr

          if ($p.ExitCode -ne 0) {{
              throw "Failed to set RustDesk password. ExitCode=$($p.ExitCode)"
          }}

          Write-Step "Service status"
          Get-Service | Where-Object {{ $_.Name -like "*Rustdesk*" -or $_.DisplayName -like "*RustDesk*" }} | Format-Table -AutoSize

          Write-Host ""
          Write-Host "RustDesk installation and configuration finished."
          Write-Host "RustDesk ID: $rustdesk_id"
          """)
          
          r = s.run_ps(ps_script)

          print("===== WinRM STDOUT =====")
          print(r.std_out.decode("utf-8", errors="replace") or "(empty)")
          print("===== WinRM STDERR =====")
          print(r.std_err.decode("utf-8", errors="replace") or "(empty)")

          if r.status_code != 0:
              raise SystemExit(r.status_code)
          PY

      - name: Display connection details and keep alive
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "        TUNNEL CONNECTION DETAILS (via bore.pub)            "
          echo "============================================================"
          echo ""
          echo "[1] RDP (Remote Desktop):"
          echo "    Address: bore.pub:$BOR_RDP_PORT"
          echo ""
          echo "[2] WinRM (PowerShell Remoting):"
          echo "    Server:   bore.pub"
          echo "    Port:     $BOR_WINRM_PORT"
          echo "    Username: $WINDOWS_USER"
          echo ""
          echo "[3] RustDesk has been installed silently on the Windows machine."
          echo "    Use the RustDesk app on your phone or PC, then connect to the ID printed in the WinRM log."
          echo ""
          echo "============================================================"
          echo "Tunnel is ready. Keeping job alive for 6 hours..."
          while true; do
            echo "Alive: $(date)"
            sleep 300
          done
