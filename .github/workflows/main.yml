name: Web RDP Gateway (Ubuntu)

on:
  workflow_dispatch:

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo apt-get update
          sudo apt-get install -y tailscale tailscale-archive-keyring

      - name: Connect to Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=web-gateway
          TS_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "✅ Tailscale connected! IP: $TS_IP"

      - name: Install Docker & Run Guacamole with PostgreSQL
        run: |
          # حذف بسته‌های قدیمی Docker
          sudo apt-get remove -y docker docker-engine docker.io containerd runc 2>/dev/null || true
          
          # نصب پیش‌نیازها
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release
          
          # اضافه کردن کلید GPG رسمی Docker
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          
          # اضافه کردن مخزن رسمی Docker
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          # نصب Docker
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          
          # اجرای Docker
          sudo systemctl start docker
          sudo systemctl enable docker
          
          # ایجاد فایل docker-compose.yml
          cat > docker-compose.yml <<EOF
          version: '3'
          services:
            guacd:
              image: guacamole/guacd
              container_name: guacd
              restart: always
              networks:
                - guac-network

            postgres:
              image: postgres:15-alpine
              container_name: postgres
              restart: always
              environment:
                POSTGRES_USER: guacamole_user
                POSTGRES_PASSWORD: guacamole_pass
                POSTGRES_DB: guacamole_db
              networks:
                - guac-network
              volumes:
                - pgdata:/var/lib/postgresql/data

            guacamole:
              image: guacamole/guacamole
              container_name: guacamole
              restart: always
              ports:
                - "8080:8080"
              environment:
                GUACD_HOSTNAME: guacd
                POSTGRESQL_HOSTNAME: postgres
                POSTGRESQL_DATABASE: guacamole_db
                POSTGRESQL_USER: guacamole_user
                POSTGRESQL_PASSWORD: guacamole_pass
              networks:
                - guac-network
              depends_on:
                - guacd
                - postgres

          networks:
            guac-network:
              driver: bridge

          volumes:
            pgdata:
          EOF
          
          # اجرا با docker compose
          sudo docker compose up -d
          
          # صبر برای راه‌اندازی کامل
          sleep 10
          
          echo "✅ Apache Guacamole with PostgreSQL is running on port 8080"

      - name: Display Connection Details
        run: |
          echo "============================================"
          echo "🚀 WEB RDP GATEWAY IS READY"
          echo "============================================"
          echo ""
          echo "📋 CONNECTION DETAILS:"
          echo "   Address: http://${{ env.TAILSCALE_IP }}:8080/guacamole/"
          echo "   Username: guacadmin"
          echo "   Password: guacadmin"
          echo ""
          echo "🔗 Now add a connection to Windows RDP:"
          echo "   1. Login with guacadmin/guacadmin"
          echo "   2. Go to Settings -> Connections -> New Connection"
          echo "   3. Protocol: RDP"
          echo "   4. Hostname: [IP of Windows machine from Repo 1]"
          echo "   5. Port: 3389"
          echo "   6. Username: runneradmin"
          echo "   7. Password: WindowsRDP#2025"
          echo ""
          echo "============================================"
          echo ""
          echo "⏳ Session will stay alive for 6 hours..."

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
            echo "✓ Session active - $(date '+%H:%M:%S')"
          done
