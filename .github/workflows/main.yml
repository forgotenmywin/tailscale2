name: RDP Tunnel via Bore (Proxy Picker)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PROXY_REPO: forgotenmywin/tailscale2
      PROXY_BRANCH: main

    steps:
      - name: Install Tailscale
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start and connect Tailscale
        run: |
          set -euo pipefail
          sudo tailscaled &
          sleep 8

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="bore-tunnel"

          echo "===== Tailscale Status ====="
          sudo tailscale status || true
          echo "===== Tailscale IP ====="
          sudo tailscale ip -4 || true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cargo \
            socat \
            iputils-ping \
            netcat-openbsd \
            proxychains4 \
            curl \
            python3

          cargo install bore-cli
          sudo cp ~/.cargo/bin/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore

      - name: Fetch proxy lists from repo
        env:
          GIT_TT: ${{ secrets.GIT_TT }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ["PROXY_REPO"]
          branch = os.environ.get("PROXY_BRANCH", "main")
          token = os.environ.get("GIT_TT", "").strip()

          if not token:
              raise SystemExit("GIT_TT secret is empty")

          def fetch_file(path: str, out_path: str) -> None:
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "proxy-fetcher",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Authorization": f"Bearer {token}",
              }
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)

              if "content" not in data:
                  raise RuntimeError(f"Could not read {path}")

              content = base64.b64decode(data["content"])
              with open(out_path, "wb") as f:
                  f.write(content)

          fetch_file("ir.txt", "/tmp/ir.txt")
          fetch_file("us.txt", "/tmp/us.txt")

          print("Fetched /tmp/ir.txt and /tmp/us.txt")
          PY

      - name: Verify Windows reachability
        run: |
          set -euo pipefail
          WIN_IP="${{ secrets.WINDOWS_IP }}"

          echo "======================================"
          echo "Windows IP: $WIN_IP"
          echo "======================================"

          if [ -z "$WIN_IP" ]; then
            echo "❌ WINDOWS_IP secret is empty"
            exit 1
          fi

          echo "===== Ping Test ====="
          ping -c 4 "$WIN_IP"

          echo "===== RDP Port Test ====="
          nc -zvw5 "$WIN_IP" 3389

          echo "✅ Windows is reachable and port 3389 is open"

      - name: Start local RDP forward with socat
        run: |
          set -euo pipefail
          WIN_IP="${{ secrets.WINDOWS_IP }}"

          echo "Starting socat forward: 127.0.0.1:3389 -> $WIN_IP:3389"
          nohup socat \
            TCP-LISTEN:3389,fork,reuseaddr \
            TCP:$WIN_IP:3389 \
            >/tmp/socat.log 2>&1 &

          sleep 3

          echo "===== Listening Ports ====="
          ss -tln || true

          echo "===== Socat Log ====="
          cat /tmp/socat.log || true

      - name: Test local forward
        run: |
          set -euo pipefail

          echo "===== Local Forward Test ====="
          nc -zvw5 127.0.0.1 3389

          echo "===== RDP Handshake Test ====="
          timeout 5 bash -c 'echo | nc 127.0.0.1 3389' || true

          echo "✅ Local forward is working"

      - name: Select best proxy
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          IR_FILE = Path("/tmp/ir.txt")
          US_FILE = Path("/tmp/us.txt")
          TEST_URL = "https://example.com/"
          THRESHOLD_MS = 150.0

          def parse_ir(path: Path):
              proxies = []
              if not path.exists():
                  return proxies

              for raw in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue

                  # ir.txt format: IP:PORT  -> HTTPS proxy
                  m = re.fullmatch(r"(?P<host>\d{1,3}(?:\.\d{1,3}){3}):(?P<port>\d+)", line)
                  if not m:
                      continue

                  proxies.append({
                      "source": "ir",
                      "host": m.group("host"),
                      "port": m.group("port"),
                      "type": "HTTPS",
                      "user": "",
                      "pass": "",
                  })
              return proxies

          def parse_us(path: Path):
              proxies = []
              if not path.exists():
                  return proxies

              # us.txt format: IP:PORT@USER:PASS  -> SOCKS5 proxy
              pattern = re.compile(
                  r"^(?P<host>\d{1,3}(?:\.\d{1,3}){3}):(?P<port>\d+)@(?P<user>[^:]+):(?P<pw>.+)$"
              )

              for raw in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue

                  m = pattern.match(line)
                  if not m:
                      continue

                  proxies.append({
                      "source": "us",
                      "host": m.group("host"),
                      "port": m.group("port"),
                      "type": "SOCKS5",
                      "user": m.group("user"),
                      "pass": m.group("pw"),
                  })
              return proxies

          def proxy_url(p):
              if p["type"] == "SOCKS5":
                  return f"socks5h://{p['user']}:{p['pass']}@{p['host']}:{p['port']}"
              if p["type"] == "SOCKS4":
                  return f"socks4://{p['host']}:{p['port']}"
              return f"http://{p['host']}:{p['port']}"

          def proxychains_line(p):
              if p["type"] == "SOCKS5":
                  return f"socks5 {p['host']} {p['port']} {p['user']} {p['pass']}"
              if p["type"] == "SOCKS4":
                  return f"socks4 {p['host']} {p['port']}"
              return f"http {p['host']} {p['port']}"

          def test_proxy(p):
              url = proxy_url(p)
              cmd = [
                  "curl",
                  "-L",
                  "-o", "/dev/null",
                  "-sS",
                  "--max-time", "15",
                  "-w", "%{time_total}",
                  "--proxy", url,
                  TEST_URL,
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True)

              if proc.returncode != 0:
                  err = (proc.stderr or proc.stdout or "").strip().replace("\n", " ")
                  return None, err[-220:]

              out = (proc.stdout or "").strip().replace(",", ".")
              try:
                  return float(out) * 1000.0, ""
              except Exception:
                  return None, f"bad curl output: {out!r}"

          def print_hit(p, ms):
              if ms < THRESHOLD_MS:
                  print(f"🟢 {p['source']} {p['host']}:{p['port']} {p['type']}  {ms:.0f} ms")
              else:
                  print(f"   {p['source']} {p['host']}:{p['port']} {p['type']}  {ms:.0f} ms")

          ir = parse_ir(IR_FILE)
          us = parse_us(US_FILE)

          if not ir:
              print("No usable proxies found in ir.txt")
              sys.exit(1)

          print("=== Testing IR proxies ===")
          ir_good = []
          for p in ir:
              ms, err = test_proxy(p)
              if ms is None:
                  print(f"🔴 ir {p['host']}:{p['port']} {p['type']}  FAIL  {err}")
                  continue
              print_hit(p, ms)
              if ms < THRESHOLD_MS:
                  ir_good.append((ms, p))

          chosen = None

          if ir_good:
              ir_good.sort(key=lambda x: x[0])
              chosen = ir_good[0][1]
              print("")
              print(f"✅ Selected IR proxy under {THRESHOLD_MS:.0f} ms")
          else:
              print("")
              print(f"No IR proxy under {THRESHOLD_MS:.0f} ms, checking US proxies...")
              if not us:
                  print("No usable proxies found in us.txt")
                  sys.exit(1)

              us_good = []
              print("=== Testing US proxies ===")
              for p in us:
                  ms, err = test_proxy(p)
                  if ms is None:
                      print(f"🔴 us {p['host']}:{p['port']} {p['type']}  FAIL  {err}")
                      continue
                  print_hit(p, ms)
                  us_good.append((ms, p))

              if not us_good:
                  print("No usable proxies found in us.txt")
                  sys.exit(1)

              us_good.sort(key=lambda x: x[0])
              chosen = us_good[0][1]
              print("")
              print("✅ Selected best US proxy")

          url = proxy_url(chosen)
          chain_line = proxychains_line(chosen)

          print("")
          print("=== Final Choice ===")
          print(f"Source: {chosen['source']}")
          print(f"Proxy:  {chosen['host']}:{chosen['port']} {chosen['type']}")
          if chosen["user"]:
              print(f"User:   {chosen['user']}")
          print(f"URL:    {url}")
          print(f"Chain:  {chain_line}")

          with open("/tmp/best_proxy.env", "w", encoding="utf-8") as f:
              f.write(f"BEST_PROXY_SOURCE={chosen['source']}\n")
              f.write(f"BEST_PROXY_HOST={chosen['host']}\n")
              f.write(f"BEST_PROXY_PORT={chosen['port']}\n")
              f.write(f"BEST_PROXY_TYPE={chosen['type']}\n")
              f.write(f"BEST_PROXY_USER={chosen['user']}\n")
              f.write(f"BEST_PROXY_PASS={chosen['pass']}\n")
              f.write(f"BEST_PROXY_URL={url}\n")
              f.write(f"BEST_PROXY_CHAIN={chain_line}\n")
          PY

          cat /tmp/best_proxy.env >> "$GITHUB_ENV"

      - name: Create proxychains config
        run: |
          set -euo pipefail

          cat > /tmp/proxychains.conf <<EOF
          strict_chain
          proxy_dns
          tcp_read_time_out 15000
          tcp_connect_time_out 15000

          [ProxyList]
          $BEST_PROXY_CHAIN
          EOF

          echo "===== Proxychains Config ====="
          cat /tmp/proxychains.conf

      - name: Start Bore tunnel through selected proxy
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Starting Bore through selected proxy"
          echo "Proxy: $BEST_PROXY_URL"
          echo "Source: $BEST_PROXY_SOURCE"
          echo "======================================"

          nohup proxychains4 -f /tmp/proxychains.conf -q bore local --to bore.pub 3389 >/tmp/bore.log 2>&1 &

          echo "Waiting for Bore to publish port..."
          for i in $(seq 1 60); do
            if grep -q "listening at bore.pub:" /tmp/bore.log; then
              break
            fi
            sleep 1
          done

          echo "===== Bore Log ====="
          cat /tmp/bore.log || true

          BOR_PORT="$(grep -oE 'listening at bore\.pub:[0-9]+' /tmp/bore.log | tail -n1 | awk -F: '{print $2}')"

          if [ -z "${BOR_PORT:-}" ]; then
            echo "❌ Bore did not publish a port"
            exit 1
          fi

          echo "Bore port: $BOR_PORT"
          echo "BOR_PORT=$BOR_PORT" >> "$GITHUB_ENV"

      - name: Smoke test Bore endpoint
        run: |
          set -euo pipefail

          echo "===== Bore Smoke Test ====="
          nc -zvw5 bore.pub "$BOR_PORT" || true

          echo "===== Bore Log ====="
          cat /tmp/bore.log || true

          echo "✅ Bore tunnel is up"

      - name: Keep alive
        run: |
          set -euo pipefail
          while true; do
            sleep 300
          done
