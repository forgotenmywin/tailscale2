name: Headless Browser + RustDesk + Real Chromium

on:
  workflow_dispatch:

jobs:
  browser-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      DISPLAY: :99
      RUSTDESK_PASSWORD: ChangeMe-12345!
      START_URL: https://example.com
      XDG_RUNTIME_DIR: /tmp/runtime-runner

    steps:
      - name: Prepare runtime dir
        run: |
          set -euxo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

      - name: Update system
        run: |
          set -euxo pipefail
          sudo apt-get update

      - name: Install desktop base
        run: |
          set -euxo pipefail
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            xvfb \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            xauth \
            procps \
            python3 \
            python3-pip

      - name: Start virtual display
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x720x24 -ac +extension RANDR +render -noreset >/tmp/xvfb.log 2>&1 &
          sleep 3

      - name: Start XFCE desktop
        run: |
          set -euxo pipefail
          DISPLAY=:99 dbus-run-session -- startxfce4 >/tmp/xfce.log 2>&1 &
          sleep 10

      - name: Install RustDesk
        run: |
          set -euxo pipefail
          curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest -o /tmp/rustdesk-release.json

          python3 - <<'PY'
          import json,re,pathlib
          data=json.load(open('/tmp/rustdesk-release.json'))
          for a in data.get("assets",[]):
              name=a.get("name","")
              if re.search(r'rustdesk-.*(x86_64|amd64)\.deb$',name):
                  pathlib.Path('/tmp/rustdesk-url.txt').write_text(a["browser_download_url"])
                  break
          PY

          curl -fL "$(cat /tmp/rustdesk-url.txt)" -o /tmp/rustdesk.deb
          sudo apt-get install -y /tmp/rustdesk.deb

      - name: Start RustDesk
        run: |
          set -euxo pipefail
          DISPLAY=:99 dbus-run-session -- nohup rustdesk --password "$RUSTDESK_PASSWORD" >/tmp/rustdesk.log 2>&1 &
          sleep 20

      - name: Print RustDesk ID
        run: |
          set -euxo pipefail
          for i in $(seq 1 36); do
            ID="$(rustdesk --get-id 2>/dev/null | tail -n 1 || true)"
            if [ -n "$ID" ]; then
              echo "RustDesk ID: $ID"
              break
            fi
            sleep 5
          done

      - name: Install Playwright and Chromium
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install chromium

      - name: Start real Chromium window
        run: |
          set -euxo pipefail

          cat > /tmp/start_browser.py <<'PY'
          import os,time
          from playwright.sync_api import sync_playwright

          url=os.environ.get("START_URL","https://example.com")

          with sync_playwright() as p:
              browser=p.chromium.launch(
                  headless=False,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--start-maximized"
                  ]
              )

              page=browser.new_page(viewport={"width":1280,"height":720})
              page.goto(url,wait_until="domcontentloaded")
              page.bring_to_front()

              while True:
                  time.sleep(60)
          PY

          DISPLAY=:99 dbus-run-session -- nohup python3 /tmp/start_browser.py >/tmp/chromium.log 2>&1 &

      - name: Show logs
        run: |
          set -euxo pipefail

          echo "=== RustDesk log ==="
          tail -n 120 /tmp/rustdesk.log || true

          echo "=== Chromium log ==="
          tail -n 120 /tmp/chromium.log || true

          echo "=== XFCE log ==="
          tail -n 120 /tmp/xfce.log || true

          echo "=== Xvfb log ==="
          tail -n 120 /tmp/xvfb.log || true
