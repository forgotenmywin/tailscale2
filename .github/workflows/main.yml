name: RDP + WinRM Tunnel via Bore (Ubuntu)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      WINDOWS_IP: ${{ secrets.WINDOWS_IP }}
      WINDOWS_USER: runneradmin
      WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
      ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}

    steps:
      - name: Install Tailscale
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start and connect Tailscale
        run: |
          set -euo pipefail
          sudo tailscaled &
          sleep 8

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="bore-tunnel"

          echo "===== Tailscale Status ====="
          sudo tailscale status || true
          echo "===== Tailscale IP ====="
          sudo tailscale ip -4 || true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cargo socat iputils-ping netcat-openbsd python3 python3-pip

          cargo install bore-cli
          sudo cp ~/.cargo/bin/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore

          python3 -m pip install --upgrade pip
          python3 -m pip install pywinrm

      - name: Verify Windows reachability
        run: |
          set -euo pipefail
          WIN_IP="${WINDOWS_IP}"

          echo "======================================"
          echo "Windows IP: $WIN_IP"
          echo "======================================"

          if [ -z "$WIN_IP" ]; then
            echo "❌ WINDOWS_IP secret is empty"
            exit 1
          fi

          echo "===== Ping Test ====="
          ping -c 4 "$WIN_IP" || true

          echo "===== RDP Port Test ====="
          nc -zvw5 "$WIN_IP" 3389

          echo "===== WinRM Port Test ====="
          nc -zvw5 "$WIN_IP" 5985

          echo "✅ Windows is reachable, ports 3389 (RDP) and 5985 (WinRM) are open"

      - name: Start local forwards with socat
        run: |
          set -euo pipefail
          WIN_IP="${WINDOWS_IP}"

          echo "Starting socat forward: 127.0.0.1:3389 -> $WIN_IP:3389"
          nohup socat \
            TCP-LISTEN:3389,fork,reuseaddr \
            TCP:$WIN_IP:3389 \
            >/tmp/socat-rdp.log 2>&1 &

          echo "Starting socat forward: 127.0.0.1:5985 -> $WIN_IP:5985"
          nohup socat \
            TCP-LISTEN:5985,fork,reuseaddr \
            TCP:$WIN_IP:5985 \
            >/tmp/socat-winrm.log 2>&1 &

          sleep 3

          echo "===== Listening Ports ====="
          ss -tln || true

          echo "===== Socat Logs ====="
          echo "RDP log:"
          cat /tmp/socat-rdp.log || true
          echo "WinRM log:"
          cat /tmp/socat-winrm.log || true

      - name: Test local forwards
        run: |
          set -euo pipefail

          echo "===== Local RDP Forward Test ====="
          nc -zvw5 127.0.0.1 3389

          echo "===== Local WinRM Forward Test ====="
          nc -zvw5 127.0.0.1 5985

          echo "✅ Both local forwards are working"

      - name: Start Bore tunnels
        run: |
          set -euo pipefail

          echo "Starting Bore tunnel for RDP (3389)..."
          nohup bore local --to bore.pub 3389 >/tmp/bore-rdp.log 2>&1 &

          echo "Starting Bore tunnel for WinRM (5985)..."
          nohup bore local --to bore.pub 5985 >/tmp/bore-winrm.log 2>&1 &

          echo "Waiting for Bore to publish ports..."
          for i in $(seq 1 60); do
            if grep -q "listening at bore.pub:" /tmp/bore-rdp.log && grep -q "listening at bore.pub:" /tmp/bore-winrm.log; then
              break
            fi
            sleep 1
          done

          echo "===== Bore Logs ====="
          echo "RDP Bore log:"
          cat /tmp/bore-rdp.log || true
          echo "WinRM Bore log:"
          cat /tmp/bore-winrm.log || true

          BOR_RDP_PORT="$(grep -oE 'listening at bore\.pub:[0-9]+' /tmp/bore-rdp.log | tail -n1 | awk -F: '{print $2}')"
          BOR_WINRM_PORT="$(grep -oE 'listening at bore\.pub:[0-9]+' /tmp/bore-winrm.log | tail -n1 | awk -F: '{print $2}')"

          if [ -z "${BOR_RDP_PORT:-}" ]; then
            echo "❌ Bore did not publish a port for RDP"
            exit 1
          fi
          if [ -z "${BOR_WINRM_PORT:-}" ]; then
            echo "❌ Bore did not publish a port for WinRM"
            exit 1
          fi

          echo "Bore RDP port: $BOR_RDP_PORT"
          echo "Bore WinRM port: $BOR_WINRM_PORT"
          echo "BOR_RDP_PORT=$BOR_RDP_PORT" >> "$GITHUB_ENV"
          echo "BOR_WINRM_PORT=$BOR_WINRM_PORT" >> "$GITHUB_ENV"

      - name: Smoke test Bore endpoints
        run: |
          set -euo pipefail

          echo "===== Bore Smoke Test (RDP) ====="
          nc -zvw5 bore.pub "$BOR_RDP_PORT" || true

          echo "===== Bore Smoke Test (WinRM) ====="
          nc -zvw5 bore.pub "$BOR_WINRM_PORT" || true

          echo "✅ Both Bore tunnels are up"

      - name: Install AnyDesk on Windows via WinRM
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import sys
          import textwrap
          import winrm

          host = "127.0.0.1:5985"
          user = os.environ["WINDOWS_USER"]
          password = os.environ["WINDOWS_PASSWORD"]
          anydesk_password = os.environ["ANYDESK_PASSWORD"]

          if not password:
              print("WINDOWS_PASSWORD is empty", file=sys.stderr)
              sys.exit(1)
          if not anydesk_password:
              print("ANYDESK_PASSWORD is empty", file=sys.stderr)
              sys.exit(1)

          # Safe transport for a local Windows account over WinRM.
          s = winrm.Session(host, auth=(user, password), transport="ntlm")

          pwd_b64 = base64.b64encode(anydesk_password.encode("utf-8")).decode("ascii")

          ps_script = textwrap.dedent(f"""
          $ErrorActionPreference = "Stop"

          $installer = "C:\\Windows\\Temp\\AnyDesk.exe"
          $installDir = "C:\\Program Files (x86)\\AnyDesk"
          $exe = Join-Path $installDir "AnyDesk.exe"

          Write-Host "Downloading AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile $installer

          Write-Host "Installing AnyDesk silently..."
          Start-Process -FilePath $installer -ArgumentList "--install `"$installDir`" --start-with-win --create-shortcuts --silent" -Wait

          Start-Sleep -Seconds 10

          if (-not (Test-Path $exe)) {{
              throw "AnyDesk.exe not found at $exe"
          }}

          Write-Host "Starting AnyDesk service/client..."
          Start-Process -FilePath $exe -ArgumentList "--start" -Wait

          Write-Host "Setting Unattended Access password..."
          $pwd = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("{pwd_b64}"))

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.Arguments = "--set-password _unattended_access"
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true

          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.WriteLine($pwd)
          $p.StandardInput.Close()
          $p.WaitForExit()

          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()

          if ($p.ExitCode -ne 0) {{
              throw "Failed to set password. ExitCode=$($p.ExitCode) STDOUT=$stdout STDERR=$stderr"
          }}

          Write-Host "===== AnyDesk Services ====="
          Get-Service | Where-Object {{ $_.Name -like "*AnyDesk*" -or $_.DisplayName -like "*AnyDesk*" }} | Format-Table -AutoSize

          Write-Host "AnyDesk installation and configuration finished."
          """)

          r = s.run_ps(ps_script)
          stdout = r.std_out.decode("utf-8", errors="replace")
          stderr = r.std_err.decode("utf-8", errors="replace")

          print("===== WinRM STDOUT =====")
          print(stdout or "(empty)")
          print("===== WinRM STDERR =====")
          print(stderr or "(empty)")

          if r.status_code != 0:
              raise SystemExit(r.status_code)
          PY

      - name: Display connection details and keep alive
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "        TUNNEL CONNECTION DETAILS (via bore.pub)            "
          echo "============================================================"
          echo ""
          echo "[1] RDP (Remote Desktop):"
          echo "    Address: bore.pub:$BOR_RDP_PORT"
          echo ""
          echo "[2] WinRM (PowerShell Remoting):"
          echo "    Server:   bore.pub"
          echo "    Port:     $BOR_WINRM_PORT"
          echo "    Username: runneradmin"
          echo "    (Use with any WinRM client)"
          echo ""
          echo "[3] AnyDesk has been installed silently on the Windows machine."
          echo "    Standard AnyDesk installs typically live at:"
          echo "    C:\\Program Files (x86)\\AnyDesk\\AnyDesk.exe"
          echo "    and AnyDesk supports setting unattended access from the CLI."
          echo ""
          echo "============================================================"
          echo "Tunnel is ready. Keeping job alive for 6 hours..."
          while true; do
            echo "Alive: $(date)"
            sleep 300
          done
